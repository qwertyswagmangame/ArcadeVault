<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asteroid Dodge</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0d121a;
        color: #f1f5f9;
        font-family: system-ui, -apple-system, sans-serif;
        user-select: none;
        overflow: hidden;
      }
      .hud {
        width: min(94vw, 680px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 4px;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }
      .stats { display: flex; gap: 18px; font-weight: 600; }
      .stats span strong { color: #f59e0b; }
      button {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.14);
        background: #1a2332;
        color: #f1f5f9;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover { background: #243044; }
      .btn-primary { background: #f59e0b; color: #11161f; border-color: transparent; }
      .btn-primary:hover { background: #fbbf24; }
      .stage-wrap {
        position: relative;
        width: min(94vw, 680px);
        aspect-ratio: 16 / 10;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.12);
        background: #0b1018;
        overflow: hidden;
      }
      canvas { width: 100%; height: 100%; display: block; }
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        background: rgba(11, 16, 24, 0.86);
      }
      .overlay[hidden] { display: none; }
      .overlay h1 { margin: 0; font-size: 26px; }
      .overlay p { margin: 0; font-size: 14px; color: #94a3b8; max-width: 36ch; }
    </style>
  </head>
  <body>
    <div class="hud">
      <div class="stats">
        <span>Score <strong id="score-el">0</strong></span>
        <span>Best <strong id="best-el">0</strong></span>
        <span>Shield <strong id="shield-el">Ready</strong></span>
      </div>
      <button type="button" id="restart-btn">Restart</button>
    </div>

    <div class="stage-wrap">
      <canvas id="game" width="680" height="425"></canvas>
      <div class="overlay" id="overlay">
        <h1 id="overlay-title">Asteroid Dodge</h1>
        <p id="overlay-desc">Steer with WASD, Arrow Keys, or your mouse to weave through incoming asteroids and grab golden cells.</p>
        <button type="button" class="btn-primary" id="start-btn">Launch Ship</button>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score-el');
      const bestEl = document.getElementById('best-el');
      const shieldEl = document.getElementById('shield-el');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');
      const startBtn = document.getElementById('start-btn');
      const restartBtn = document.getElementById('restart-btn');

      const W = canvas.width;
      const H = canvas.height;
      const BEST_KEY = 'av_dodge_best';
      let best = Number(localStorage.getItem(BEST_KEY) || 0);
      bestEl.textContent = String(best);

      const stars = Array.from({ length: 55 }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        s: Math.random() * 1.8 + 0.6,
        v: Math.random() * 1.2 + 0.4,
      }));

      let state = 'TITLE_MENU';
      let score = 0;
      let frame = 0;
      let rafId = 0;
      let ship = { x: 90, y: H / 2, r: 14, shield: true };
      let rocks = [];
      let orbs = [];
      const keys = {};

      function spawnRock() {
        const speed = 3.2 + Math.min(4.5, score / 400);
        const r = 14 + Math.random() * 20;
        rocks.push({
          x: W + r,
          y: r + Math.random() * (H - r * 2),
          r,
          vx: -(speed + Math.random() * 1.6),
          vy: (Math.random() - 0.5) * 1.1,
        });
      }

      function spawnOrb() {
        orbs.push({
          x: W + 16,
          y: 28 + Math.random() * (H - 56),
          r: 9,
          vx: -3.2,
        });
      }

      function draw() {
        ctx.fillStyle = '#0b1018';
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = 'rgba(226, 232, 240, 0.5)';
        stars.forEach((st) => {
          ctx.fillRect(st.x, st.y, st.s, st.s);
        });

        // Orbs
        orbs.forEach((o) => {
          ctx.fillStyle = '#f59e0b';
          ctx.beginPath();
          ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
          ctx.fill();
        });

        // Asteroids
        rocks.forEach((rk) => {
          ctx.fillStyle = '#475569';
          ctx.strokeStyle = '#94a3b8';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(rk.x, rk.y, rk.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        });

        // Ship
        if (ship.shield) {
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.65)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(ship.x, ship.y, ship.r + 7, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.moveTo(ship.x + 18, ship.y);
        ctx.lineTo(ship.x - 14, ship.y - 11);
        ctx.lineTo(ship.x - 8, ship.y);
        ctx.lineTo(ship.x - 14, ship.y + 11);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.moveTo(ship.x - 10, ship.y - 4);
        ctx.lineTo(ship.x - 18, ship.y);
        ctx.lineTo(ship.x - 10, ship.y + 4);
        ctx.closePath();
        ctx.fill();
      }

      function loop() {
        if (state !== 'PLAYING') return;
        frame++;

        stars.forEach((st) => {
          st.x -= st.v;
          if (st.x < 0) { st.x = W; st.y = Math.random() * H; }
        });

        const spd = 5.2;
        if (keys['arrowup'] || keys['w']) ship.y -= spd;
        if (keys['arrowdown'] || keys['s']) ship.y += spd;
        if (keys['arrowleft'] || keys['a']) ship.x -= spd;
        if (keys['arrowright'] || keys['d']) ship.x += spd;

        ship.x = Math.max(20, Math.min(W - 24, ship.x));
        ship.y = Math.max(20, Math.min(H - 20, ship.y));

        const spawnRate = Math.max(18, 40 - Math.floor(score / 120));
        if (frame % spawnRate === 0) spawnRock();
        if (frame % 170 === 0) spawnOrb();

        rocks.forEach((rk) => {
          rk.x += rk.vx;
          rk.y += rk.vy;
        });
        rocks = rocks.filter((rk) => rk.x + rk.r > -20);

        orbs.forEach((o) => { o.x += o.vx; });
        orbs = orbs.filter((o) => o.x + o.r > -20);

        for (let i = orbs.length - 1; i >= 0; i--) {
          const o = orbs[i];
          if (Math.hypot(ship.x - o.x, ship.y - o.y) < ship.r + o.r) {
            score += 50;
            if (!ship.shield) {
              ship.shield = true;
              shieldEl.textContent = 'Ready';
            }
            orbs.splice(i, 1);
          }
        }

        for (let i = rocks.length - 1; i >= 0; i--) {
          const rk = rocks[i];
          if (Math.hypot(ship.x - rk.x, ship.y - rk.y) < ship.r + rk.r - 4) {
            if (ship.shield) {
              ship.shield = false;
              shieldEl.textContent = 'Depleted';
              rocks.splice(i, 1);
            } else {
              endGame();
              return;
            }
          }
        }

        if (frame % 6 === 0) {
          score += 1;
          scoreEl.textContent = String(score);
          if (score > best) {
            best = score;
            bestEl.textContent = String(best);
            localStorage.setItem(BEST_KEY, String(best));
          }
        }

        draw();
        rafId = requestAnimationFrame(loop);
      }

      function startGame() {
        cancelAnimationFrame(rafId);
        score = 0;
        frame = 0;
        rocks = [];
        orbs = [];
        ship = { x: 90, y: H / 2, r: 14, shield: true };
        scoreEl.textContent = '0';
        shieldEl.textContent = 'Ready';
        state = 'PLAYING';
        overlay.hidden = true;
        rafId = requestAnimationFrame(loop);
      }

      function endGame() {
        state = 'GAME_OVER';
        overlayTitle.textContent = 'Hull Breached';
        overlayDesc.textContent = `Final score: ${score}.`;
        startBtn.textContent = 'Fly Again';
        overlay.hidden = false;
        draw();
      }

      canvas.addEventListener('mousemove', (e) => {
        if (state !== 'PLAYING') return;
        const rect = canvas.getBoundingClientRect();
        ship.x = ((e.clientX - rect.left) / rect.width) * W;
        ship.y = ((e.clientY - rect.top) / rect.height) * H;
      });

      window.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
        keys[k] = true;
      });
      window.addEventListener('keyup', (e) => {
        keys[e.key.toLowerCase()] = false;
      });

      startBtn.addEventListener('click', startGame);
      restartBtn.addEventListener('click', startGame);
      draw();
    </script>
  </body>
</html>
