<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desert Dash</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0d121a;
        color: #f1f5f9;
        font-family: system-ui, -apple-system, sans-serif;
        user-select: none;
        overflow: hidden;
      }
      .hud {
        width: min(94vw, 700px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 4px;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }
      .stats { display: flex; gap: 18px; font-weight: 600; }
      .stats span strong { color: #f59e0b; }
      button {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.14);
        background: #1a2332;
        color: #f1f5f9;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      .btn-primary { background: #f59e0b; color: #11161f; border-color: transparent; }
      .stage-wrap {
        position: relative;
        width: min(94vw, 700px);
        aspect-ratio: 2 / 1;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.12);
        background: #141b26;
        overflow: hidden;
      }
      canvas { width: 100%; height: 100%; display: block; cursor: pointer; }
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        background: rgba(13, 18, 26, 0.84);
      }
      .overlay[hidden] { display: none; }
      .overlay h1 { margin: 0; font-size: 26px; }
      .overlay p { margin: 0; font-size: 14px; color: #94a3b8; max-width: 36ch; }
    </style>
  </head>
  <body>
    <div class="hud">
      <div class="stats">
        <span>Distance <strong id="score-el">0</strong></span>
        <span>Best <strong id="best-el">0</strong></span>
      </div>
      <button type="button" id="restart-btn">Restart</button>
    </div>

    <div class="stage-wrap">
      <canvas id="game" width="700" height="350"></canvas>
      <div class="overlay" id="overlay">
        <h1 id="overlay-title">Desert Dash</h1>
        <p id="overlay-desc">Press Space, Up Arrow, or Click to leap over cacti. Hold Down Arrow to duck beneath flyers.</p>
        <button type="button" class="btn-primary" id="start-btn">Start Run</button>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.getElementById('score-el');
      const bestEl = document.getElementById('best-el');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');
      const startBtn = document.getElementById('start-btn');
      const restartBtn = document.getElementById('restart-btn');

      const W = canvas.width, H = canvas.height;
      const GROUND_Y = 286;
      const BEST_KEY = 'av_dino_best';
      let best = Number(localStorage.getItem(BEST_KEY) || 0);
      bestEl.textContent = String(best);

      let state = 'TITLE_MENU';
      let dino = { x: 76, y: GROUND_Y - 46, w: 36, h: 46, vy: 0, ducking: false };
      let obstacles = [];
      let score = 0;
      let speed = 5.4;
      let spawnTimer = 0;
      let frame = 0;
      let rafId = 0;

      function jump() {
        if (state === 'TITLE_MENU' || state === 'GAME_OVER') {
          startGame();
          return;
        }
        const standBottom = GROUND_Y;
        const dinoBottom = dino.y + (dino.ducking ? 28 : 46);
        if (state === 'PLAYING' && dinoBottom >= standBottom - 1) {
          dino.vy = -12.4;
        }
      }

      function spawnObstacle() {
        const isFlyer = score > 160 && Math.random() < 0.28;
        if (isFlyer) {
          const high = Math.random() > 0.45;
          obstacles.push({
            type: 'flyer',
            x: W + 30,
            y: high ? GROUND_Y - 68 : GROUND_Y - 36,
            w: 38,
            h: 22,
          });
        } else {
          const count = Math.random() < 0.35 ? 2 : 1;
          const h = 34 + Math.random() * 18;
          obstacles.push({
            type: 'cactus',
            x: W + 30,
            y: GROUND_Y - h,
            w: count === 2 ? 34 : 20,
            h,
          });
        }
      }

      function draw() {
        const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
        grad.addColorStop(0, '#141c29');
        grad.addColorStop(1, '#26212c');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, GROUND_Y);

        // Ground
        ctx.fillStyle = '#1b2330';
        ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(0, GROUND_Y, W, 3);

        // Obstacles
        obstacles.forEach((ob) => {
          if (ob.type === 'cactus') {
            ctx.fillStyle = '#10b981';
            ctx.beginPath();
            ctx.roundRect(ob.x, ob.y, ob.w, ob.h, 4);
            ctx.fill();
          } else {
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.moveTo(ob.x, ob.y + ob.h / 2);
            ctx.lineTo(ob.x + ob.w, ob.y);
            ctx.lineTo(ob.x + ob.w - 6, ob.y + ob.h);
            ctx.closePath();
            ctx.fill();
          }
        });

        // Dino
        const dh = dino.ducking ? 28 : 46;
        const dw = dino.ducking ? 46 : 34;
        const dy = dino.ducking ? GROUND_Y - 28 : dino.y;
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.roundRect(dino.x, dy, dw, dh, 6);
        ctx.fill();
        ctx.fillStyle = '#11161f';
        ctx.beginPath();
        ctx.arc(dino.x + dw - 8, dy + 10, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      function loop() {
        if (state !== 'PLAYING') return;
        frame++;
        speed = Math.min(11.5, 5.4 + score / 280);

        dino.vy += 0.65;
        dino.y += dino.vy;
        if (dino.y > GROUND_Y - 46) {
          dino.y = GROUND_Y - 46;
          dino.vy = 0;
        }

        spawnTimer--;
        if (spawnTimer <= 0) {
          spawnObstacle();
          spawnTimer = Math.max(42, Math.floor(86 - speed * 3 + Math.random() * 38));
        }

        const dh = dino.ducking ? 28 : 46;
        const dw = dino.ducking ? 46 : 34;
        const dy = dino.ducking ? GROUND_Y - 28 : dino.y;

        for (let i = obstacles.length - 1; i >= 0; i--) {
          const ob = obstacles[i];
          ob.x -= speed;
          if (
            dino.x + 4 < ob.x + ob.w &&
            dino.x + dw - 4 > ob.x &&
            dy + 4 < ob.y + ob.h &&
            dy + dh - 4 > ob.y
          ) {
            endGame();
            return;
          }
          if (ob.x + ob.w < -20) obstacles.splice(i, 1);
        }

        if (frame % 4 === 0) {
          score++;
          scoreEl.textContent = String(score);
          if (score > best) {
            best = score;
            bestEl.textContent = String(best);
            localStorage.setItem(BEST_KEY, String(best));
          }
        }

        draw();
        rafId = requestAnimationFrame(loop);
      }

      function startGame() {
        cancelAnimationFrame(rafId);
        dino = { x: 76, y: GROUND_Y - 46, w: 34, h: 46, vy: 0, ducking: false };
        obstacles = [];
        score = 0;
        speed = 5.4;
        spawnTimer = 45;
        frame = 0;
        scoreEl.textContent = '0';
        state = 'PLAYING';
        overlay.hidden = true;
        rafId = requestAnimationFrame(loop);
      }

      function endGame() {
        state = 'GAME_OVER';
        overlayTitle.textContent = 'Obstacle Hit';
        overlayDesc.textContent = `Distance: ${score} · Best: ${best}`;
        startBtn.textContent = 'Run Again';
        overlay.hidden = false;
        draw();
      }

      canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        jump();
      });
      startBtn.addEventListener('click', startGame);
      restartBtn.addEventListener('click', startGame);

      window.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
          e.preventDefault();
          jump();
        } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
          e.preventDefault();
          dino.ducking = true;
        }
      });
      window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
          dino.ducking = false;
        }
      });

      draw();
    </script>
  </body>
</html>
