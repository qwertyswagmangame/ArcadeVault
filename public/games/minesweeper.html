<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minesweeper</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0d121a;
        color: #f1f5f9;
        font-family: system-ui, -apple-system, sans-serif;
        user-select: none;
        overflow: hidden;
      }
      .hud {
        width: min(94vw, 440px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }
      .stats { display: flex; gap: 14px; font-weight: 600; }
      .stats span strong { color: #f59e0b; }
      .controls { display: flex; gap: 8px; }
      button {
        padding: 7px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.14);
        background: #1a2332;
        color: #f1f5f9;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover { background: #243044; }
      button.is-active { background: #f59e0b; color: #11161f; border-color: transparent; }
      .grid-wrap {
        position: relative;
        width: min(94vw, 440px);
        aspect-ratio: 1 / 1;
        padding: 10px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.12);
        background: #18202c;
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        grid-template-rows: repeat(10, 1fr);
        gap: 4px;
      }
      .cell {
        padding: 0;
        min-height: 0;
        border-radius: 5px;
        border: 1px solid rgba(255,255,255,0.12);
        background: #253144;
        font-size: 15px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .cell.revealed {
        background: #11161f;
        border-color: rgba(255,255,255,0.05);
        cursor: default;
      }
      .cell.flagged { background: #3b2626; color: #f87171; }
      .cell.mine { background: #991b1b; color: #fff; }
      .n1 { color: #38bdf8; }
      .n2 { color: #34d399; }
      .n3 { color: #f87171; }
      .n4 { color: #a78bfa; }
      .n5 { color: #fbbf24; }
      .n6 { color: #2dd4bf; }
      .banner {
        margin-top: 10px;
        font-size: 14px;
        font-weight: 600;
        min-height: 20px;
        color: #94a3b8;
      }
      .banner.win { color: #34d399; }
      .banner.lose { color: #f87171; }
    </style>
  </head>
  <body>
    <div class="hud">
      <div class="stats">
        <span>Mines <strong id="mines-el">15</strong></span>
        <span>Time <strong id="time-el">0s</strong></span>
      </div>
      <div class="controls">
        <button type="button" id="flag-mode-btn">Flag Mode</button>
        <button type="button" id="restart-btn">New Board</button>
      </div>
    </div>

    <div class="grid-wrap" id="grid"></div>
    <p class="banner" id="banner">Click to reveal · Right-click or use Flag Mode to mark mines</p>

    <script>
      const SIZE = 10;
      const MINES = 15;
      const gridEl = document.getElementById('grid');
      const minesEl = document.getElementById('mines-el');
      const timeEl = document.getElementById('time-el');
      const flagModeBtn = document.getElementById('flag-mode-btn');
      const restartBtn = document.getElementById('restart-btn');
      const bannerEl = document.getElementById('banner');

      let board = [];
      let firstClick = true;
      let gameOver = false;
      let flagMode = false;
      let flagsUsed = 0;
      let seconds = 0;
      let timerId = null;

      function neighbors(r, c) {
        const list = [];
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE) list.push([nr, nc]);
          }
        }
        return list;
      }

      function placeMines(safeR, safeC) {
        let placed = 0;
        while (placed < MINES) {
          const r = Math.floor(Math.random() * SIZE);
          const c = Math.floor(Math.random() * SIZE);
          if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
          if (!board[r][c].mine) {
            board[r][c].mine = true;
            placed++;
          }
        }
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            board[r][c].adj = neighbors(r, c).filter(([nr, nc]) => board[nr][nc].mine).length;
          }
        }
      }

      function revealCell(r, c) {
        const cell = board[r][c];
        if (cell.revealed || cell.flagged || gameOver) return;

        if (firstClick) {
          firstClick = false;
          placeMines(r, c);
          timerId = setInterval(() => {
            seconds++;
            timeEl.textContent = `${seconds}s`;
          }, 1000);
        }

        cell.revealed = true;
        if (cell.mine) {
          gameOver = true;
          clearInterval(timerId);
          board.flat().forEach((x) => { if (x.mine) x.revealed = true; });
          bannerEl.textContent = 'Mine triggered! Click New Board to try again.';
          bannerEl.className = 'banner lose';
          render();
          return;
        }

        if (cell.adj === 0) {
          neighbors(r, c).forEach(([nr, nc]) => revealCell(nr, nc));
        }

        checkWin();
        render();
      }

      function checkWin() {
        const unrevealedSafe = board.flat().filter((x) => !x.mine && !x.revealed).length;
        if (unrevealedSafe === 0 && !gameOver) {
          gameOver = true;
          clearInterval(timerId);
          bannerEl.textContent = `Board cleared in ${seconds}s!`;
          bannerEl.className = 'banner win';
        }
      }

      function toggleFlag(r, c) {
        const cell = board[r][c];
        if (cell.revealed || gameOver) return;
        cell.flagged = !cell.flagged;
        flagsUsed += cell.flagged ? 1 : -1;
        minesEl.textContent = String(MINES - flagsUsed);
        render();
      }

      function render() {
        gridEl.innerHTML = '';
        for (let r = 0; r < SIZE; r++) {
          for (let c = 0; c < SIZE; c++) {
            const cell = board[r][c];
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'cell';
            if (cell.revealed) {
              btn.classList.add('revealed');
              if (cell.mine) {
                btn.classList.add('mine');
                btn.textContent = '✕';
              } else if (cell.adj > 0) {
                btn.classList.add(`n${cell.adj}`);
                btn.textContent = String(cell.adj);
              }
            } else if (cell.flagged) {
              btn.classList.add('flagged');
              btn.textContent = '⚑';
            }

            btn.addEventListener('click', () => {
              if (flagMode) toggleFlag(r, c);
              else revealCell(r, c);
            });
            btn.addEventListener('contextmenu', (e) => {
              e.preventDefault();
              toggleFlag(r, c);
            });
            gridEl.appendChild(btn);
          }
        }
      }

      function initBoard() {
        clearInterval(timerId);
        board = Array.from({ length: SIZE }, () =>
          Array.from({ length: SIZE }, () => ({ mine: false, revealed: false, flagged: false, adj: 0 }))
        );
        firstClick = true;
        gameOver = false;
        flagsUsed = 0;
        seconds = 0;
        minesEl.textContent = String(MINES);
        timeEl.textContent = '0s';
        bannerEl.textContent = 'Click to reveal · Right-click or use Flag Mode to mark mines';
        bannerEl.className = 'banner';
        render();
      }

      flagModeBtn.addEventListener('click', () => {
        flagMode = !flagMode;
        flagModeBtn.classList.toggle('is-active', flagMode);
      });
      restartBtn.addEventListener('click', initBoard);

      initBoard();
    </script>
  </body>
</html>
