<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Flip Match</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0d121a;
        color: #f1f5f9;
        font-family: system-ui, -apple-system, sans-serif;
        user-select: none;
        overflow: hidden;
      }
      .hud {
        width: min(92vw, 440px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }
      .stats { display: flex; gap: 16px; font-weight: 600; }
      .stats span strong { color: #f59e0b; }
      button {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.14);
        background: #1a2332;
        color: #f1f5f9;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover { background: #243044; }
      .grid {
        width: min(92vw, 440px);
        aspect-ratio: 1 / 1;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
        gap: 10px;
      }
      .card {
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.12);
        background: #1a2332;
        font-size: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 160ms ease, background-color 160ms ease, border-color 160ms ease;
      }
      .card.flipped {
        background: #253247;
        border-color: #f59e0b;
        color: #fbbf24;
      }
      .card.matched {
        background: #14332a;
        border-color: #10b981;
        color: #34d399;
        cursor: default;
      }
      .status {
        margin-top: 12px;
        min-height: 20px;
        font-size: 14px;
        color: #94a3b8;
        font-weight: 500;
      }
      .status.won { color: #34d399; }
    </style>
  </head>
  <body>
    <div class="hud">
      <div class="stats">
        <span>Moves <strong id="moves-el">0</strong></span>
        <span>Pairs <strong id="pairs-el">0/8</strong></span>
        <span>Time <strong id="time-el">0s</strong></span>
      </div>
      <button type="button" id="restart-btn">Shuffle</button>
    </div>

    <div class="grid" id="grid"></div>
    <p class="status" id="status">Flip two cards to find matching geometric pairs.</p>

    <script>
      const SYMBOLS = ['◆', '▲', '●', '★', '✦', '⬢', '✚', '☾'];
      const gridEl = document.getElementById('grid');
      const movesEl = document.getElementById('moves-el');
      const pairsEl = document.getElementById('pairs-el');
      const timeEl = document.getElementById('time-el');
      const statusEl = document.getElementById('status');
      const restartBtn = document.getElementById('restart-btn');

      let cards = [];
      let flipped = [];
      let locked = false;
      let moves = 0;
      let pairs = 0;
      let seconds = 0;
      let timerId = null;

      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function startTimer() {
        if (timerId) return;
        timerId = setInterval(() => {
          seconds++;
          timeEl.textContent = `${seconds}s`;
        }, 1000);
      }

      function render() {
        gridEl.innerHTML = '';
        cards.forEach((card, idx) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'card';
          if (card.matched) {
            btn.classList.add('matched');
            btn.textContent = card.symbol;
          } else if (card.open) {
            btn.classList.add('flipped');
            btn.textContent = card.symbol;
          } else {
            btn.textContent = '·';
          }
          btn.addEventListener('click', () => onFlip(idx));
          gridEl.appendChild(btn);
        });
      }

      function onFlip(idx) {
        if (locked) return;
        const card = cards[idx];
        if (card.open || card.matched) return;

        startTimer();
        card.open = true;
        flipped.push(idx);
        render();

        if (flipped.length === 2) {
          moves++;
          movesEl.textContent = String(moves);
          const [a, b] = flipped;
          if (cards[a].symbol === cards[b].symbol) {
            cards[a].matched = true;
            cards[b].matched = true;
            pairs++;
            pairsEl.textContent = `${pairs}/8`;
            flipped = [];
            render();
            if (pairs === 8) {
              clearInterval(timerId);
              statusEl.textContent = `All pairs matched in ${moves} moves (${seconds}s)!`;
              statusEl.className = 'status won';
            }
          } else {
            locked = true;
            setTimeout(() => {
              cards[a].open = false;
              cards[b].open = false;
              flipped = [];
              locked = false;
              render();
            }, 600);
          }
        }
      }

      function initGame() {
        clearInterval(timerId);
        timerId = null;
        seconds = 0;
        moves = 0;
        pairs = 0;
        flipped = [];
        locked = false;
        movesEl.textContent = '0';
        pairsEl.textContent = '0/8';
        timeEl.textContent = '0s';
        statusEl.textContent = 'Flip two cards to find matching geometric pairs.';
        statusEl.className = 'status';
        cards = shuffle([...SYMBOLS, ...SYMBOLS]).map((symbol) => ({
          symbol,
          open: false,
          matched: false,
        }));
        render();
      }

      restartBtn.addEventListener('click', initGame);
      initGame();
    </script>
  </body>
</html>
