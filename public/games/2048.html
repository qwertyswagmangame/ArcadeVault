<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2048 Tile Merge</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0d121a;
        color: #f1f5f9;
        font-family: system-ui, -apple-system, sans-serif;
        user-select: none;
        overflow: hidden;
      }
      .hud {
        width: min(92vw, 420px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
        font-variant-numeric: tabular-nums;
      }
      .stats { display: flex; gap: 16px; font-size: 14px; font-weight: 600; }
      .stats span strong { color: #f59e0b; }
      button {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.14);
        background: #1a2332;
        color: #f1f5f9;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover { background: #243044; }
      .btn-primary { background: #f59e0b; color: #11161f; border-color: transparent; }
      .btn-primary:hover { background: #fbbf24; }
      .board-wrap {
        position: relative;
        width: min(92vw, 420px);
        aspect-ratio: 1 / 1;
        padding: 12px;
        background: #18202c;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
        gap: 10px;
      }
      .tile {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        background: #101620;
        font-size: 26px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        transition: transform 110ms ease, background-color 110ms ease;
      }
      .t-2 { background: #263142; color: #f8fafc; }
      .t-4 { background: #334155; color: #f8fafc; }
      .t-8 { background: #b45309; color: #fff; }
      .t-16 { background: #d97706; color: #fff; }
      .t-32 { background: #ea580c; color: #fff; }
      .t-64 { background: #dc2626; color: #fff; }
      .t-128 { background: #f59e0b; color: #11161f; font-size: 22px; }
      .t-256 { background: #fbbf24; color: #11161f; font-size: 22px; }
      .t-512 { background: #10b981; color: #052e16; font-size: 22px; }
      .t-1024 { background: #38bdf8; color: #082f49; font-size: 19px; }
      .t-2048 { background: #fde047; color: #11161f; font-size: 19px; }
      .overlay {
        position: absolute;
        inset: 0;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        background: rgba(13, 18, 26, 0.88);
      }
      .overlay[hidden] { display: none; }
      .overlay h1 { margin: 0; font-size: 24px; }
      .overlay p { margin: 0; font-size: 14px; color: #94a3b8; }
      .hint { margin-top: 10px; font-size: 12px; color: #94a3b8; }
    </style>
  </head>
  <body>
    <div class="hud">
      <div class="stats">
        <span>Score <strong id="score-el">0</strong></span>
        <span>Best <strong id="best-el">0</strong></span>
      </div>
      <button type="button" id="restart-btn">New Game</button>
    </div>

    <div class="board-wrap" id="board">
      <div class="overlay" id="overlay" hidden>
        <h1 id="overlay-title">Game Over</h1>
        <p id="overlay-desc">No more moves left.</p>
        <button type="button" class="btn-primary" id="overlay-btn">Play Again</button>
      </div>
    </div>

    <p class="hint">Use Arrow Keys, WASD, or swipe to merge tiles.</p>

    <script>
      const boardEl = document.getElementById('board');
      const scoreEl = document.getElementById('score-el');
      const bestEl = document.getElementById('best-el');
      const restartBtn = document.getElementById('restart-btn');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');
      const overlayBtn = document.getElementById('overlay-btn');

      const BEST_KEY = 'av_2048_best';
      let best = Number(localStorage.getItem(BEST_KEY) || 0);
      bestEl.textContent = String(best);

      let grid = [];
      let score = 0;
      let wonShown = false;

      function createCells() {
        const existing = boardEl.querySelectorAll('.tile');
        existing.forEach((n) => n.remove());
        for (let i = 0; i < 16; i++) {
          const cell = document.createElement('div');
          cell.className = 'tile';
          boardEl.insertBefore(cell, overlay);
        }
      }

      function addRandomTile() {
        const empty = [];
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 4; c++) {
            if (grid[r][c] === 0) empty.push([r, c]);
          }
        }
        if (empty.length === 0) return;
        const [r, c] = empty[Math.floor(Math.random() * empty.length)];
        grid[r][c] = Math.random() < 0.9 ? 2 : 4;
      }

      function render() {
        const cells = boardEl.querySelectorAll('.tile');
        let idx = 0;
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 4; c++) {
            const val = grid[r][c];
            const cell = cells[idx++];
            cell.textContent = val ? String(val) : '';
            cell.className = val ? `tile t-${Math.min(val, 2048)}` : 'tile';
          }
        }
        scoreEl.textContent = String(score);
        if (score > best) {
          best = score;
          bestEl.textContent = String(best);
          localStorage.setItem(BEST_KEY, String(best));
        }
      }

      function slideRow(row) {
        const arr = row.filter((v) => v !== 0);
        for (let i = 0; i < arr.length - 1; i++) {
          if (arr[i] === arr[i + 1]) {
            arr[i] *= 2;
            score += arr[i];
            arr[i + 1] = 0;
            if (arr[i] === 2048 && !wonShown) {
              wonShown = true;
              overlayTitle.textContent = '2048 Reached!';
              overlayDesc.textContent = 'Keep merging or start a fresh board.';
              overlayBtn.textContent = 'Continue';
              overlay.hidden = false;
            }
          }
        }
        const merged = arr.filter((v) => v !== 0);
        while (merged.length < 4) merged.push(0);
        return merged;
      }

      function canMove() {
        for (let r = 0; r < 4; r++) {
          for (let c = 0; c < 4; c++) {
            if (grid[r][c] === 0) return true;
            if (r < 3 && grid[r][c] === grid[r + 1][c]) return true;
            if (c < 3 && grid[r][c] === grid[r][c + 1]) return true;
          }
        }
        return false;
      }

      function move(dir) {
        if (!overlay.hidden) return;
        const prev = JSON.stringify(grid);

        if (dir === 'left') {
          grid = grid.map((row) => slideRow(row));
        } else if (dir === 'right') {
          grid = grid.map((row) => slideRow([...row].reverse()).reverse());
        } else if (dir === 'up') {
          for (let c = 0; c < 4; c++) {
            const col = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]];
            const next = slideRow(col);
            for (let r = 0; r < 4; r++) grid[r][c] = next[r];
          }
        } else if (dir === 'down') {
          for (let c = 0; c < 4; c++) {
            const col = [grid[3][c], grid[2][c], grid[1][c], grid[0][c]];
            const next = slideRow(col).reverse();
            for (let r = 0; r < 4; r++) grid[r][c] = next[r];
          }
        }

        if (JSON.stringify(grid) !== prev) {
          addRandomTile();
          render();
          if (!canMove()) {
            overlayTitle.textContent = 'Game Over';
            overlayDesc.textContent = `Final score: ${score}.`;
            overlayBtn.textContent = 'Play Again';
            overlay.hidden = false;
          }
        }
      }

      function startGame() {
        grid = Array.from({ length: 4 }, () => [0, 0, 0, 0]);
        score = 0;
        wonShown = false;
        overlay.hidden = true;
        addRandomTile();
        addRandomTile();
        render();
      }

      window.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown'].includes(k)) e.preventDefault();
        if (k === 'arrowleft' || k === 'a') move('left');
        else if (k === 'arrowright' || k === 'd') move('right');
        else if (k === 'arrowup' || k === 'w') move('up');
        else if (k === 'arrowdown' || k === 's') move('down');
      });

      let touchStart = null;
      boardEl.addEventListener('touchstart', (e) => {
        if (e.touches[0]) touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      }, { passive: true });
      boardEl.addEventListener('touchend', (e) => {
        if (!touchStart || !e.changedTouches[0]) return;
        const dx = e.changedTouches[0].clientX - touchStart.x;
        const dy = e.changedTouches[0].clientY - touchStart.y;
        touchStart = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
        if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
        else move(dy > 0 ? 'down' : 'up');
      });

      restartBtn.addEventListener('click', startGame);
      overlayBtn.addEventListener('click', () => {
        if (overlayBtn.textContent === 'Continue') overlay.hidden = true;
        else startGame();
      });

      createCells();
      startGame();
    </script>
  </body>
</html>
