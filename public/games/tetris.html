<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block Stack</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0d121a;
        color: #f1f5f9;
        font-family: system-ui, -apple-system, sans-serif;
        user-select: none;
        overflow: hidden;
      }
      .layout {
        display: flex;
        align-items: flex-start;
        gap: 18px;
        padding: 12px;
      }
      .board-wrap {
        position: relative;
        width: min(56vh, 300px);
        aspect-ratio: 1 / 2;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.12);
        background: #141b26;
        overflow: hidden;
      }
      canvas#board { width: 100%; height: 100%; display: block; }
      .sidebar {
        width: 150px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .panel {
        background: #18202c;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px;
        padding: 12px;
      }
      .label { font-size: 11px; color: #94a3b8; font-weight: 600; margin-bottom: 4px; }
      .value { font-size: 20px; font-weight: 700; color: #f59e0b; font-variant-numeric: tabular-nums; }
      canvas#next { width: 100%; height: 80px; display: block; }
      button {
        width: 100%;
        padding: 9px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.14);
        background: #1a2332;
        color: #f1f5f9;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover { background: #243044; }
      .btn-primary { background: #f59e0b; color: #11161f; border-color: transparent; }
      .btn-primary:hover { background: #fbbf24; }
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 20px;
        text-align: center;
        background: rgba(13, 18, 26, 0.88);
      }
      .overlay[hidden] { display: none; }
      .overlay h1 { margin: 0; font-size: 24px; }
      .overlay p { margin: 0; font-size: 13px; color: #94a3b8; }
      .touch-bar {
        display: none;
        gap: 6px;
        margin-top: 8px;
      }
      @media (max-width: 520px) {
        .layout { flex-direction: column; align-items: center; }
        .sidebar { width: 300px; flex-direction: row; flex-wrap: wrap; }
        .panel { flex: 1; min-width: 85px; }
        .touch-bar { display: flex; width: 300px; }
      }
    </style>
  </head>
  <body>
    <div>
      <div class="layout">
        <div class="board-wrap">
          <canvas id="board" width="240" height="480"></canvas>
          <div class="overlay" id="overlay">
            <h1 id="overlay-title">Block Stack</h1>
            <p id="overlay-desc">Left/Right to move, Up to rotate, Down to soft drop, Space to hard drop.</p>
            <button type="button" class="btn-primary" id="start-btn">Start Game</button>
          </div>
        </div>

        <aside class="sidebar">
          <div class="panel">
            <div class="label">Next Piece</div>
            <canvas id="next" width="120" height="80"></canvas>
          </div>
          <div class="panel">
            <div class="label">Score</div>
            <div class="value" id="score-el">0</div>
          </div>
          <div class="panel">
            <div class="label">Lines</div>
            <div class="value" id="lines-el">0</div>
          </div>
          <div class="panel">
            <div class="label">Level</div>
            <div class="value" id="level-el">1</div>
          </div>
          <button type="button" id="pause-btn">Pause</button>
        </aside>
      </div>

      <div class="touch-bar">
        <button type="button" data-act="left">◀</button>
        <button type="button" data-act="rotate">↻</button>
        <button type="button" data-act="down">▼</button>
        <button type="button" data-act="right">▶</button>
        <button type="button" class="btn-primary" data-act="drop">Drop</button>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('board');
      const ctx = canvas.getContext('2d');
      const nextCanvas = document.getElementById('next');
      const nextCtx = nextCanvas.getContext('2d');
      const scoreEl = document.getElementById('score-el');
      const linesEl = document.getElementById('lines-el');
      const levelEl = document.getElementById('level-el');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');
      const startBtn = document.getElementById('start-btn');
      const pauseBtn = document.getElementById('pause-btn');

      const COLS = 10, ROWS = 20, SZ = 24;
      const COLORS = [
        null,
        '#38bdf8', // I
        '#f59e0b', // O
        '#a78bfa', // T
        '#10b981', // S
        '#ef4444', // Z
        '#3b82f6', // J
        '#fb923c', // L
      ];
      const SHAPES = [
        [],
        [[1,1,1,1]],
        [[2,2],[2,2]],
        [[0,3,0],[3,3,3]],
        [[0,4,4],[4,4,0]],
        [[5,5,0],[0,5,5]],
        [[6,0,0],[6,6,6]],
        [[0,0,7],[7,7,7]],
      ];

      let grid = [];
      let piece = null;
      let nextType = 1;
      let score = 0, lines = 0, level = 1;
      let state = 'TITLE_MENU';
      let dropCounter = 0;
      let lastTime = 0;
      let rafId = 0;

      function emptyGrid() {
        return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      }

      function randomType() {
        return 1 + Math.floor(Math.random() * 7);
      }

      function makePiece(type) {
        const matrix = SHAPES[type].map((r) => [...r]);
        return {
          matrix,
          x: Math.floor((COLS - matrix[0].length) / 2),
          y: 0,
        };
      }

      function collide(mat, ox, oy) {
        for (let r = 0; r < mat.length; r++) {
          for (let c = 0; c < mat[r].length; c++) {
            if (!mat[r][c]) continue;
            const nx = ox + c;
            const ny = oy + r;
            if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
            if (ny >= 0 && grid[ny][nx]) return true;
          }
        }
        return false;
      }

      function rotateMatrix(mat) {
        const rows = mat.length, cols = mat[0].length;
        const out = Array.from({ length: cols }, () => Array(rows).fill(0));
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            out[c][rows - 1 - r] = mat[r][c];
          }
        }
        return out;
      }

      function merge() {
        piece.matrix.forEach((row, r) => {
          row.forEach((val, c) => {
            if (val && piece.y + r >= 0) {
              grid[piece.y + r][piece.x + c] = val;
            }
          });
        });
      }

      function clearLines() {
        let cleared = 0;
        for (let r = ROWS - 1; r >= 0; r--) {
          if (grid[r].every((v) => v !== 0)) {
            grid.splice(r, 1);
            grid.unshift(Array(COLS).fill(0));
            cleared++;
            r++;
          }
        }
        if (cleared > 0) {
          const pts = [0, 100, 300, 500, 800][cleared] * level;
          score += pts;
          lines += cleared;
          level = 1 + Math.floor(lines / 10);
          scoreEl.textContent = String(score);
          linesEl.textContent = String(lines);
          levelEl.textContent = String(level);
        }
      }

      function spawnNext() {
        piece = makePiece(nextType);
        nextType = randomType();
        drawNext();
        if (collide(piece.matrix, piece.x, piece.y)) {
          state = 'GAME_OVER';
          overlayTitle.textContent = 'Stack Full';
          overlayDesc.textContent = `Score: ${score} · Lines: ${lines}`;
          startBtn.textContent = 'Play Again';
          overlay.hidden = false;
        }
      }

      function drawNext() {
        nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
        const mat = SHAPES[nextType];
        const cell = 20;
        const ox = (nextCanvas.width - mat[0].length * cell) / 2;
        const oy = (nextCanvas.height - mat.length * cell) / 2;
        mat.forEach((row, r) => {
          row.forEach((val, c) => {
            if (!val) return;
            nextCtx.fillStyle = COLORS[val];
            nextCtx.fillRect(ox + c * cell + 1, oy + r * cell + 1, cell - 2, cell - 2);
          });
        });
      }

      function draw() {
        ctx.fillStyle = '#141b26';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        for (let c = 1; c < COLS; c++) {
          ctx.beginPath(); ctx.moveTo(c * SZ, 0); ctx.lineTo(c * SZ, canvas.height); ctx.stroke();
        }
        for (let r = 1; r < ROWS; r++) {
          ctx.beginPath(); ctx.moveTo(0, r * SZ); ctx.lineTo(canvas.width, r * SZ); ctx.stroke();
        }

        grid.forEach((row, r) => {
          row.forEach((val, c) => {
            if (!val) return;
            ctx.fillStyle = COLORS[val];
            ctx.fillRect(c * SZ + 1, r * SZ + 1, SZ - 2, SZ - 2);
          });
        });

        if (piece) {
          // Ghost
          let gy = piece.y;
          while (!collide(piece.matrix, piece.x, gy + 1)) gy++;
          ctx.fillStyle = 'rgba(255,255,255,0.12)';
          piece.matrix.forEach((row, r) => {
            row.forEach((val, c) => {
              if (val) ctx.fillRect((piece.x + c) * SZ + 1, (gy + r) * SZ + 1, SZ - 2, SZ - 2);
            });
          });

          piece.matrix.forEach((row, r) => {
            row.forEach((val, c) => {
              if (!val) return;
              ctx.fillStyle = COLORS[val];
              ctx.fillRect((piece.x + c) * SZ + 1, (piece.y + r) * SZ + 1, SZ - 2, SZ - 2);
            });
          });
        }
      }

      function dropOne() {
        if (!collide(piece.matrix, piece.x, piece.y + 1)) {
          piece.y++;
        } else {
          merge();
          clearLines();
          spawnNext();
        }
        dropCounter = 0;
      }

      function hardDrop() {
        while (!collide(piece.matrix, piece.x, piece.y + 1)) {
          piece.y++;
          score += 2;
        }
        scoreEl.textContent = String(score);
        merge();
        clearLines();
        spawnNext();
        dropCounter = 0;
      }

      function tryMove(dx) {
        if (!collide(piece.matrix, piece.x + dx, piece.y)) piece.x += dx;
      }

      function tryRotate() {
        const rotated = rotateMatrix(piece.matrix);
        for (const offset of [0, -1, 1, -2, 2]) {
          if (!collide(rotated, piece.x + offset, piece.y)) {
            piece.matrix = rotated;
            piece.x += offset;
            return;
          }
        }
      }

      function update(time = 0) {
        if (state !== 'PLAYING') return;
        const delta = time - lastTime;
        lastTime = time;
        dropCounter += delta;
        const interval = Math.max(110, 720 - (level - 1) * 65);
        if (dropCounter > interval) dropOne();
        draw();
        rafId = requestAnimationFrame(update);
      }

      function startGame() {
        cancelAnimationFrame(rafId);
        grid = emptyGrid();
        score = 0; lines = 0; level = 1;
        scoreEl.textContent = '0';
        linesEl.textContent = '0';
        levelEl.textContent = '1';
        nextType = randomType();
        spawnNext();
        state = 'PLAYING';
        overlay.hidden = true;
        pauseBtn.textContent = 'Pause';
        lastTime = performance.now();
        rafId = requestAnimationFrame(update);
      }

      function togglePause() {
        if (state === 'PLAYING') {
          state = 'PAUSED';
          cancelAnimationFrame(rafId);
          pauseBtn.textContent = 'Resume';
          overlayTitle.textContent = 'Paused';
          overlayDesc.textContent = 'Press Resume or P to continue.';
          startBtn.textContent = 'Resume';
          overlay.hidden = false;
        } else if (state === 'PAUSED') {
          state = 'PLAYING';
          pauseBtn.textContent = 'Pause';
          overlay.hidden = true;
          lastTime = performance.now();
          rafId = requestAnimationFrame(update);
        }
      }

      startBtn.addEventListener('click', () => {
        if (state === 'PAUSED') togglePause();
        else startGame();
      });
      pauseBtn.addEventListener('click', togglePause);

      document.querySelectorAll('[data-act]').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (state !== 'PLAYING') return;
          const act = btn.dataset.act;
          if (act === 'left') tryMove(-1);
          else if (act === 'right') tryMove(1);
          else if (act === 'rotate') tryRotate();
          else if (act === 'down') dropOne();
          else if (act === 'drop') hardDrop();
          draw();
        });
      });

      window.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', ' '].includes(k)) e.preventDefault();
        if (k === 'p') { togglePause(); return; }
        if (state !== 'PLAYING') return;
        if (k === 'arrowleft' || k === 'a') tryMove(-1);
        else if (k === 'arrowright' || k === 'd') tryMove(1);
        else if (k === 'arrowup' || k === 'w') tryRotate();
        else if (k === 'arrowdown' || k === 's') dropOne();
        else if (k === ' ') hardDrop();
        draw();
      });

      grid = emptyGrid();
      draw();
      drawNext();
    </script>
  </body>
</html>
