<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paddle Pong</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0d121a;
        color: #f1f5f9;
        font-family: system-ui, -apple-system, sans-serif;
        user-select: none;
        overflow: hidden;
      }
      .hud {
        width: min(94vw, 680px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 4px;
        font-size: 14px;
        font-variant-numeric: tabular-nums;
      }
      .scores { display: flex; gap: 20px; font-weight: 700; font-size: 16px; }
      .scores strong { color: #f59e0b; }
      .controls { display: flex; gap: 8px; }
      button {
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.14);
        background: #1a2332;
        color: #f1f5f9;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      .btn-primary { background: #f59e0b; color: #11161f; border-color: transparent; }
      .stage-wrap {
        position: relative;
        width: min(94vw, 680px);
        aspect-ratio: 16 / 10;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.12);
        background: #141b26;
        overflow: hidden;
      }
      canvas { width: 100%; height: 100%; display: block; }
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
        background: rgba(13, 18, 26, 0.86);
      }
      .overlay[hidden] { display: none; }
      .overlay h1 { margin: 0; font-size: 26px; }
      .overlay p { margin: 0; font-size: 14px; color: #94a3b8; max-width: 38ch; }
      .mode-btns { display: flex; gap: 10px; }
    </style>
  </head>
  <body>
    <div class="hud">
      <div class="scores">
        <span>P1 <strong id="p1-el">0</strong></span>
        <span id="p2-label">CPU <strong id="p2-el">0</strong></span>
      </div>
      <div class="controls">
        <button type="button" id="mode-btn">Mode: 1P vs CPU</button>
        <button type="button" id="restart-btn">Reset</button>
      </div>
    </div>

    <div class="stage-wrap">
      <canvas id="game" width="680" height="425"></canvas>
      <div class="overlay" id="overlay">
        <h1 id="overlay-title">Paddle Pong</h1>
        <p id="overlay-desc">First to 7 points wins. Use W/S or Mouse for Left Paddle (Up/Down Arrows for Player 2).</p>
        <div class="mode-btns">
          <button type="button" class="btn-primary" id="start-1p">Play vs CPU</button>
          <button type="button" id="start-2p">2-Player Local</button>
        </div>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const p1El = document.getElementById('p1-el');
      const p2El = document.getElementById('p2-el');
      const p2Label = document.getElementById('p2-label');
      const modeBtn = document.getElementById('mode-btn');
      const restartBtn = document.getElementById('restart-btn');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlay-title');
      const overlayDesc = document.getElementById('overlay-desc');
      const start1p = document.getElementById('start-1p');
      const start2p = document.getElementById('start-2p');

      const W = canvas.width, H = canvas.height;
      const PW = 12, PH = 84;
      let twoPlayer = false;
      let state = 'TITLE_MENU';
      let p1 = { x: 20, y: H / 2 - PH / 2, score: 0 };
      let p2 = { x: W - 20 - PW, y: H / 2 - PH / 2, score: 0 };
      let ball = { x: W / 2, y: H / 2, r: 8, vx: 5, vy: 3 };
      let rafId = 0;
      const keys = {};

      function resetBall(dir) {
        ball.x = W / 2;
        ball.y = H / 2;
        ball.vx = dir * 5.2;
        ball.vy = (Math.random() * 4 - 2) || 2;
      }

      function updateScoreUI() {
        p1El.textContent = String(p1.score);
        p2Label.innerHTML = `${twoPlayer ? 'P2' : 'CPU'} <strong id="p2-el">${p2.score}</strong>`;
      }

      function draw() {
        ctx.fillStyle = '#141b26';
        ctx.fillRect(0, 0, W, H);

        // Center dashed line
        ctx.strokeStyle = 'rgba(255,255,255,0.14)';
        ctx.setLineDash([8, 10]);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(W / 2, 16);
        ctx.lineTo(W / 2, H - 16);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#f1f5f9';
        ctx.beginPath();
        ctx.roundRect(p1.x, p1.y, PW, PH, 6);
        ctx.roundRect(p2.x, p2.y, PW, PH, 6);
        ctx.fill();

        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
      }

      function loop() {
        if (state !== 'PLAYING') return;

        const spd = 6.2;
        if (keys['w']) p1.y -= spd;
        if (keys['s']) p1.y += spd;
        if (!twoPlayer) {
          if (keys['arrowup']) p1.y -= spd;
          if (keys['arrowdown']) p1.y += spd;
          const target = ball.y - PH / 2;
          p2.y += Math.max(-4.8, Math.min(4.8, (target - p2.y) * 0.14));
        } else {
          if (keys['arrowup']) p2.y -= spd;
          if (keys['arrowdown']) p2.y += spd;
        }

        p1.y = Math.max(10, Math.min(H - PH - 10, p1.y));
        p2.y = Math.max(10, Math.min(H - PH - 10, p2.y));

        ball.x += ball.vx;
        ball.y += ball.vy;

        if (ball.y - ball.r < 0 || ball.y + ball.r > H) {
          ball.vy = -ball.vy;
          ball.y = Math.max(ball.r, Math.min(H - ball.r, ball.y));
        }

        // Left paddle
        if (ball.vx < 0 && ball.x - ball.r <= p1.x + PW && ball.x + ball.r >= p1.x && ball.y >= p1.y - 4 && ball.y <= p1.y + PH + 4) {
          const offset = (ball.y - (p1.y + PH / 2)) / (PH / 2);
          const speed = Math.min(10.5, Math.hypot(ball.vx, ball.vy) * 1.05);
          const angle = offset * (Math.PI / 3.4);
          ball.vx = Math.abs(speed * Math.cos(angle));
          ball.vy = speed * Math.sin(angle);
          ball.x = p1.x + PW + ball.r;
        }

        // Right paddle
        if (ball.vx > 0 && ball.x + ball.r >= p2.x && ball.x - ball.r <= p2.x + PW && ball.y >= p2.y - 4 && ball.y <= p2.y + PH + 4) {
          const offset = (ball.y - (p2.y + PH / 2)) / (PH / 2);
          const speed = Math.min(10.5, Math.hypot(ball.vx, ball.vy) * 1.05);
          const angle = offset * (Math.PI / 3.4);
          ball.vx = -Math.abs(speed * Math.cos(angle));
          ball.vy = speed * Math.sin(angle);
          ball.x = p2.x - ball.r;
        }

        if (ball.x < 0) {
          p2.score++;
          updateScoreUI();
          if (p2.score >= 7) { endGame(twoPlayer ? 'Player 2 Wins!' : 'CPU Wins'); return; }
          resetBall(1);
        } else if (ball.x > W) {
          p1.score++;
          updateScoreUI();
          if (p1.score >= 7) { endGame('Player 1 Wins!'); return; }
          resetBall(-1);
        }

        draw();
        rafId = requestAnimationFrame(loop);
      }

      function startGame(is2p) {
        twoPlayer = is2p;
        modeBtn.textContent = twoPlayer ? 'Mode: 2P Local' : 'Mode: 1P vs CPU';
        cancelAnimationFrame(rafId);
        p1.score = 0; p2.score = 0;
        p1.y = H / 2 - PH / 2;
        p2.y = H / 2 - PH / 2;
        updateScoreUI();
        resetBall(Math.random() > 0.5 ? 1 : -1);
        state = 'PLAYING';
        overlay.hidden = true;
        rafId = requestAnimationFrame(loop);
      }

      function endGame(winner) {
        state = 'GAME_OVER';
        overlayTitle.textContent = winner;
        overlayDesc.textContent = `Final Score: ${p1.score} – ${p2.score}`;
        overlay.hidden = false;
        draw();
      }

      canvas.addEventListener('mousemove', (e) => {
        if (state !== 'PLAYING' || twoPlayer) return;
        const rect = canvas.getBoundingClientRect();
        const my = ((e.clientY - rect.top) / rect.height) * H;
        p1.y = Math.max(10, Math.min(H - PH - 10, my - PH / 2));
      });

      modeBtn.addEventListener('click', () => startGame(!twoPlayer));
      restartBtn.addEventListener('click', () => startGame(twoPlayer));
      start1p.addEventListener('click', () => startGame(false));
      start2p.addEventListener('click', () => startGame(true));

      window.addEventListener('keydown', (e) => {
        const k = e.key.toLowerCase();
        if (['arrowup', 'arrowdown'].includes(k)) e.preventDefault();
        keys[k] = true;
      });
      window.addEventListener('keyup', (e) => {
        keys[e.key.toLowerCase()] = false;
      });

      draw();
    </script>
  </body>
</html>
